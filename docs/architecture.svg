<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title description">
<title id="title">ShiftProof architecture and approval boundaries</title>
<desc id="description">A coordinator confirms inputs in a local web app. A Strands agent uses local Ollama and six restricted tools. OR-Tools produces candidates, an independent verifier checks them, and separate human approval permits deterministic local exports.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#345b67"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:32px;font-weight:700}.heading{font-size:24px;font-weight:700;text-anchor:middle}.body{font-size:18px;text-anchor:middle}.small{font-size:16px;text-anchor:middle}.box{fill:#fff;stroke:#507583;stroke-width:2;rx:18}.agent{fill:#ddf1eb;stroke:#16817a;stroke-width:2;rx:18}.human{fill:#fae8bd;stroke:#aa832c;stroke-width:2;rx:18}.flow{fill:none;stroke:#345b67;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="850" fill="#f8f7ef"/>
<text x="48" y="54" class="title">ShiftProof</text><text x="48" y="85" font-size="18">Local reasoning. Independently checked schedules. Separate human approval.</text>
<rect x="48" y="130" width="270" height="126" class="human"/><text x="183" y="171" class="heading">Coordinator</text><text x="183" y="205" class="body">inputs and confirmations</text><text x="183" y="232" class="small">local browser</text>
<rect x="370" y="130" width="290" height="126" class="box"/><text x="515" y="171" class="heading">Parent session</text><text x="515" y="205" class="body">FastAPI + CSRF gates</text><text x="515" y="232" class="small">owns approval capabilities</text>
<rect x="712" y="130" width="290" height="126" class="box"/><text x="857" y="171" class="heading">Canonical case</text><text x="857" y="205" class="body">immutable constraints</text><text x="857" y="232" class="small">revision hash + provenance</text>
<rect x="1054" y="130" width="498" height="126" class="agent"/><text x="1303" y="167" class="heading">Strands agent in a worker</text><text x="1303" y="201" class="body">Native Ollama + pinned local Qwen</text><text x="1303" y="231" class="small">localhost:11435 · cloud disabled</text>
<path d="M318 193 H366" class="flow"/><path d="M660 193 H708" class="flow"/><path d="M1002 193 H1050" class="flow"/><text x="1027" y="114" class="small">IDs and facts only</text>
<rect x="1032" y="318" width="520" height="213" class="agent"/><text x="1292" y="359" class="heading">Six allowlisted tools</text><text x="1292" y="395" class="body">inspect_case · solve_schedule</text><text x="1292" y="425" class="body">diagnose_infeasibility · propose_change</text><text x="1292" y="455" class="body">simulate_change · prepare_review</text><text x="1292" y="497" class="small">No approval, export, HTTP or arbitrary execution</text><path d="M1303 256 V314" class="flow"/>
<rect x="612" y="365" width="330" height="126" class="box"/><text x="777" y="406" class="heading">Local OR-Tools solver</text><text x="777" y="440" class="body">assignments + honest statuses</text><text x="777" y="467" class="small">hypothetical results stay separate</text>
<rect x="104" y="365" width="380" height="126" class="agent"/><text x="294" y="406" class="heading">Independent verifier</text><text x="294" y="440" class="body">recomputes every hard constraint</text><text x="294" y="467" class="small">does not trust model or solver totals</text><path d="M1032 428 H947" class="flow"/><path d="M612 428 H489" class="flow"/>
<rect x="104" y="605" width="380" height="126" class="human"/><text x="294" y="646" class="heading">Human schedule approval</text><text x="294" y="680" class="body">current revision + checked candidate</text><text x="294" y="707" class="small">agent has no approval token</text>
<rect x="672" y="605" width="420" height="126" class="box"/><text x="882" y="646" class="heading">Recheck and export</text><text x="882" y="680" class="body">CSV · JSON · calendar snapshots</text><text x="882" y="707" class="small">artifact checksums; no invitations or sync</text><path d="M294 491 V600" class="flow"/><path d="M484 668 H667" class="flow"/>
<text x="48" y="798" font-size="18">Runtime has no hosted inference path. Changes require confirmation and invalidate previous approvals.</text>
</svg>
