[project]
name = "shiftproof"
version = "0.1.0"
description = "A local volunteer scheduling agent with independently checked schedules."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "strands-agents[ollama]==1.54.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "ortools==9.15.6755",
  "icalendar>=6.1,<8",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis>=6.130,<7", "ruff>=0.14,<1", "mypy>=1.18,<2"]
media = [
    "imageio-ffmpeg==0.6.0",
    "kokoro-onnx==0.4.9",
    "onnxruntime==1.22.0",
    "pillow==12.3.0",
    "resvg-py>=0.5.0",
    "soundfile==0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_llm: real local Ollama integration, requires the owned runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
